[package]
name = "ralph"
homepage = "https://github.com/cloudbridgeuy/ralph"
description = "Claude chat with memory, workers, and rich rendering"
autobins = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ralph"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { workspace = true }
blocking = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
signal-hook = { workspace = true }
dirs = { workspace = true }
libc = { workspace = true }
mermaid-text = { workspace = true }
ralph_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
syntect = { workspace = true }
termimad = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
crossterm = { workspace = true }
unicode-width = "0.2"
unicode-linebreak = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true, features = ["rustls"] }
tiny_http = { workspace = true }
reedline = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
regex = { workspace = true }
