[workspace]
members = ["xtask/", "crates/*"]
exclude = ["vendor/reedline"]
resolver = "2"

[workspace.lints.clippy]
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
mem_forget = "warn"
large_futures = "warn"
allow_attributes_without_reason = "warn"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Guzmán Monné"]
rust-version = "1.95.0"

[profile.dev]
# Disabling debug info speeds up builds.
debug = 0

[profile.release]
incremental = true
# Set this to 1 or 2 to get more useful backtraces in debugger.
debug = 0

[workspace.dependencies]

# Agent Client Protocol (cursor worker harness)
agent-client-protocol = "=3.3.0"
blocking = "1"
flate2 = "1"
futures = "0.3"
gif = { version = "0.14", default-features = false, features = ["std"] }
image-webp = "0.2"
zune-core = "0.5"
zune-jpeg = "0.5"

# Output formatting
anstream = "1.0.0"

# Base64 encoding
base64 = "0.22"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling

# Cross-platform terminal manipulation
crossterm = "0.29"

# UAX #14 line breaking
unicode-linebreak = "0.1.5"

# SIGINT / SIGTERM / SIGHUP handling
signal-hook = "0.4"

# Configuration directories
dirs = "7.0.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Unix process control
libc = "0.2"
prettytable = "0.10"
ralph_core = { path = "crates/core" }

# Random number generation

# Regex
regex = "1.0"

# HTTP client (for existing features)
reqwest = { version = "0.13.2", features = ["json"] }

# Blocking HTTP client for the local opencode server (no TLS, no gzip)
ureq = { version = "3.4", default-features = false }

# Local HTTP server for the wire proxy
tiny_http = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }

serde_ignored = "0.1.14"

# JSON
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }

# SHA-256 hashing
sha2 = "0.11"

# Diff generation
similar = "3.2.0"

# Syntax highlighting
syntect = { version = "5.2", default-features = false, features = [
  "default-fancy",
] }

# Line editor for chat input
reedline = "0.52.1"

# Testing
tempfile = "3.10"

# Mermaid diagram rendering
mermaid-text = "0.57"

# Markdown terminal rendering
termimad = "0.35.5"
thiserror = "2.0.21"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
toml = "1.1.8"

# UUID generation

[patch.crates-io]
reedline = { path = "vendor/reedline" }
