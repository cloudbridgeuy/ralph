# Mutation scope: pure ralph_core modules (phase 1) and pure ralph modules
# (phase 2), GUZ-616 design §1 and §8.
examine_globs = [
  "crates/core/src/shell_format.rs",
  "crates/core/src/status_segments/**/*.rs",
  "crates/core/src/chat_status.rs",
  "crates/core/src/chat_hold.rs",
  "crates/core/src/chat_thread.rs",
  "crates/core/src/chat_cell.rs",
  "crates/core/src/kitty.rs",
  "crates/core/src/chat_suggestion.rs",
  "crates/core/src/worker_check.rs",
  "crates/core/src/chat_memory/tree.rs",
  "crates/core/src/stream/**/*.rs",
  "crates/core/src/chunk/**/*.rs",
  "crates/core/src/wire/**/*.rs",
  "crates/core/src/worker.rs",
  "crates/core/src/worker/tools.rs",
  "crates/core/src/worker/status.rs",
  "crates/core/src/worker/worktree.rs",
  "crates/core/src/worker/rollback.rs",
  "crates/core/src/worker/ticket.rs",
  "crates/core/src/workers_view/remote.rs",
  "crates/core/src/schedule.rs",
  "crates/core/src/schedule_request.rs",
  "crates/core/src/schedule_command.rs",
  "crates/core/src/watch.rs",
  "crates/core/src/watch_store.rs",
  "crates/ralph/src/stream_processor/types.rs",
  "crates/ralph/src/stream_processor/output_block.rs",
  "crates/ralph/src/stream_processor/block_builders.rs",
  "crates/ralph/src/stream_processor/utils.rs",
  "crates/ralph/src/render/wrap.rs",
  "crates/ralph/src/render/utils.rs",
  "crates/ralph/src/markdown.rs",
  "crates/ralph/src/ansi.rs",
  "crates/ralph/src/frame.rs",
  "crates/ralph/src/formatting.rs",
  "crates/ralph/src/status_theme.rs",
  "crates/ralph/src/input_theme.rs",
]
exclude_globs = [
  ".worktrees/**", ".claude/worktrees/**",
  "vendor/**", "target/**", "xtask/**",
  "**/tests/**", "**/tests.rs",
]
# Accepted equivalent mutants, recorded in the ledger in docs/context/mutation-testing.md.
exclude_re = [
  'sse\.rs:23:34: replace < with <= in SseDecoder::push$',
  'sse\.rs:23:46: replace && with \|\| in SseDecoder::push$',
  'tree\.rs:15:28: replace > with >= in cover_at$',
  'shell_format\.rs:356:25: replace > with >= in Layout::statement$',
  'secret_headers -> .* with Vec::leak\(Vec::new\(\)\)$',
  'render/wrap\.rs:[0-9]+:[0-9]+: replace cap_wrap_width with \(\)$',
  'render/wrap\.rs:[0-9]+:[0-9]+: replace wrap_width -> usize with [01]$',
]
additional_cargo_test_args = ["--all-targets"]
timeout_multiplier = 5.0
minimum_test_timeout = 30.0
cap_lints = false
